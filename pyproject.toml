[project]
name = "ask-or-act"
version = "0.0.1"
description = "Tells you when an AI's decisions can be trusted and when to escalate to a human."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",  # vectorized metrics + bootstrap resampling
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
ask-or-act = "ask_or_act.cli:main"

[project.optional-dependencies]
providers = [
    "httpx>=0.28",  # async HTTP for the Gemini/OpenAI adapters; MockTransport for tests
]
classic = [
    "scikit-learn>=1.9",  # TF-IDF + logistic regression; needs method="temperature"
]
data = [
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# RUF001-003 flag "ambiguous" Unicode. We use α, μ, −, × deliberately in docstrings
# that state formulas from papers, so they stay readable next to the source.
ignore = ["RUF001", "RUF002", "RUF003"]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "N",        # naming
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
# These ship no type hints. sklearn and scipy are test-only (reference implementations).
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

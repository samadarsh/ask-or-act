<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --good: #006300; --bad: #d03b3b; --band: rgba(42,120,214,0.10);
  --pre: #2a78d6; --expl: #898781; --sens: #6250d6; --target: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --good: #0ca30c; --bad: #e66767; --band: rgba(57,135,229,0.16);
    --pre: #3987e5; --expl: #898781; --sens: #9085e9; --target: #f0efec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #0ca30c; --bad: #e66767; --band: rgba(57,135,229,0.16);
  --pre: #3987e5; --expl: #898781; --sens: #9085e9; --target: #f0efec;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { position: relative; padding-right: 48px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 19px; margin: 36px 0 8px; padding-top: 12px; border-top: 1px solid var(--border); }
h3 { font-size: 15px; margin: 22px 0 6px; }
h4 { font-size: 13px; margin: 16px 0 6px; font-weight: 600; }
.meta, .note, .sub, .ci, .empty { color: var(--ink-2); }
.note { max-width: 80ch; margin: 4px 0 10px; }
.sub { font-size: 12px; }
.ci { font-size: 12px; white-space: nowrap; }
.empty { font-style: italic; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
#theme { position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-radius: 18px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 18px; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
table.num td { font-variant-numeric: tabular-nums; }
td code { white-space: nowrap; overflow-wrap: normal; }
tbody tr:last-child td { border-bottom: 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em;
  padding: 1px 7px; border-radius: 10px; border: 1.5px solid currentColor; white-space: nowrap; }
.badge.pre { color: var(--pre); } .badge.expl { color: var(--expl); } .badge.sens { color: var(--sens); }
.badge.target { color: var(--target); }
.say { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin: 8px 0 12px; max-width: 92ch; }
.say p { margin: 0 0 2px; }
.say p.hd { font-size: 12px; color: var(--ink-2); }
.say p.lead { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.say p.in { padding-left: 2ch; color: var(--ink-2); }
.say p.gap { height: 6px; }
.say .from { font-size: 12px; color: var(--muted); margin-top: 8px; }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; min-width: 200px; }
.tile .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .sub { display: block; }
.ok { color: var(--good); font-size: 12px; white-space: nowrap; }
.warn { color: var(--bad); font-size: 12px; }
ul.warnings { color: var(--ink-2); font-size: 12px; margin: 6px 0; }
.howto li { margin: 3px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
figcaption { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; overflow-wrap: anywhere; }
svg.chart { width: 100%; height: auto; display: block; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .diag { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
svg .tick, svg .label, svg .rowlabel { fill: var(--muted); font-size: 10px; }
svg .label { fill: var(--ink-2); font-size: 11px; }
svg .rowlabel { fill: var(--ink-2); font-size: 11px; }
svg .line { fill: none; stroke-width: 2; }
svg .end, svg .dot { stroke: var(--surface); stroke-width: 2; }
svg .whisker { stroke-width: 2; stroke-linecap: round; }
svg .conf { stroke: var(--ink); stroke-width: 2; }
svg .band { fill: var(--band); }
svg .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .drop { stroke-width: 1.5; stroke-dasharray: 2 3; }
svg .mark { fill: var(--surface); stroke-width: 2.5; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
@media print { #theme { display: none; } }
</style></head>
<body><main>
{body}
</main>
<script>
(function () {
  var b = document.getElementById("theme"), r = document.documentElement;
  b.addEventListener("click", function () {
    var dark = r.dataset.theme ? r.dataset.theme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });
})();
</script>
</body></html>

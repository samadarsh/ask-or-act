# PILOT (day 1): Aegis on qwen: tokens, validity, redaction on real responses.
# Generated by scripts/make_study_configs.py; edit there and regenerate.
# Groq FREE tier: $0 charged, list price recorded. Dry-run first.
# CONTENT WARNING: Aegis prompts can be unsafe. Runs keep IDs and parsed answers
# only (SENSITIVE_TASKS redaction); check with `ask-or-act audit-redaction`.
name = "pilot-p8-qwen3.8-27b-aegis"

[dataset]
manifest = "data/samples/aegis.json"
split = "test"
limit = 20

[decider]
type = "groq"
model = "qwen/qwen3.8-27b"
prompt_version = "v1"

[decider.params]
tier = "free"
temperature = 0.0
reasoning_effort = "none"
max_output_tokens = 256
expected_output_tokens = 20

[execution]
max_concurrency = 2
requests_per_minute = 25     # free tier: 30 RPM
tokens_per_minute = 7000     # free tier: 8K TPM
requests_per_day = 1000      # free tier: 1K RPD
tokens_per_day = 200000      # free tier: 200K TPD
timeout_s = 180
max_retries = 6
backoff_max_s = 60

[budget]
max_usd = 0.0                # free tier: refuse anything that would be charged

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

# PILOT (day 1): gpt-oss-20b smoke: validity, tokens, agreement.
# Generated by scripts/make_study_configs.py; edit there and regenerate.
# Groq FREE tier: $0 charged, list price recorded. Dry-run first.
name = "pilot-p4-gpt-oss-20b-banking77"

[dataset]
manifest = "data/samples/banking77.json"
split = "test"
limit = 20                   # the same 20 as the 2026-11-20 smoke test

[decider]
type = "groq"
model = "openai/gpt-oss-20b"
prompt_version = "v1"

[decider.params]
tier = "free"
temperature = 0.0
reasoning_effort = "low"
max_output_tokens = 1024
expected_output_tokens = 50
samples = 3
sample_variation = "shuffle+paraphrase"
confidence_signal = "self_consistency"
sample_temperature = 1.0

[execution]
max_concurrency = 2
requests_per_minute = 25     # free tier: 30 RPM
tokens_per_minute = 7000     # free tier: 8K TPM
requests_per_day = 1000      # free tier: 1K RPD
tokens_per_day = 200000      # free tier: 200K TPD
timeout_s = 180
max_retries = 6
backoff_max_s = 60

[budget]
max_usd = 0.0                # free tier: refuse anything that would be charged

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-22, before the pilot or any study data (docs/guarantees.md).
# Only the 2026-11-20 smoke runs (20 test examples) existed; alpha = 0.10 was the
# default before them. Do not change after seeing results.
alpha = 0.10
delta = 0.10
registered = "2026-11-22"
note = "Banking77: risk <= 0.10 (wrong intent) on routed queries"

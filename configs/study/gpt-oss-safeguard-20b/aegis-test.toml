# STUDY (plan M): gpt-oss-safeguard-20b on aegis, test half, main calls.
# Generated by scripts/make_study_configs.py; edit there and regenerate.
# Groq FREE tier: $0 charged, list price recorded. Dry-run first.
# CONTENT WARNING: Aegis prompts can be unsafe. Runs keep IDs and parsed answers
# only (SENSITIVE_TASKS redaction); check with `ask-or-act audit-redaction`.
name = "study-gpt-oss-safeguard-20b-aegis-test"

[dataset]
manifest = "data/samples/aegis.json"
split = "test"
limit = 250
stratify = "label"          # safe/unsafe in the split's proportion

[decider]
type = "groq"
model = "openai/gpt-oss-safeguard-20b"
prompt_version = "v1"

[decider.params]
tier = "free"
temperature = 0.0
reasoning_effort = "low"
max_output_tokens = 1024
system_prompt = true
expected_output_tokens = 90

[execution]
max_concurrency = 1
requests_per_minute = 2.5    # free tier: 3 RPM
tokens_per_minute = 1800     # free tier: 2K TPM
requests_per_day = 1000
tokens_per_day = 200000
timeout_s = 600              # one example = 4 calls at 3/min
max_retries = 6
backoff_max_s = 60

[budget]
max_usd = 0.0                # free tier: refuse anything that would be charged

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-22, before the pilot or any study data (docs/guarantees.md).
# Only the 2026-11-20 smoke runs (20 test examples) existed; alpha = 0.10 was the
# default before them. Do not change after seeing results.
alpha = 0.10
delta = 0.10
registered = "2026-11-22"
note = "Aegis: risk <= 0.10 (wrong safe/unsafe label) on acted-on prompts"

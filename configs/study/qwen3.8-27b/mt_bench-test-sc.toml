# STUDY (plan M): qwen3.8-27b on mt_bench, test half, self-consistency, k = 3, shuffled + reworded.
# Generated by scripts/make_study_configs.py; edit there and regenerate.
# Groq FREE tier: $0 charged, list price recorded. Dry-run first.
name = "study-qwen3.8-27b-mt_bench-test-sc"

[dataset]
manifest = "data/samples/mt_bench.json"
split = "test"
limit = 50
stratify = "question"

[decider]
type = "groq"
model = "qwen/qwen3.8-27b"
prompt_version = "v1"

[decider.params]
tier = "free"
temperature = 0.0
reasoning_effort = "none"
max_output_tokens = 256
expected_output_tokens = 25
samples = 3
sample_variation = "shuffle+paraphrase"
confidence_signal = "self_consistency"
sample_temperature = 1.0

[execution]
max_concurrency = 2
requests_per_minute = 25     # free tier: 30 RPM
tokens_per_minute = 7000     # free tier: 8K TPM
requests_per_day = 1000      # free tier: 1K RPD
tokens_per_day = 200000      # free tier: 200K TPD
timeout_s = 180
max_retries = 6
backoff_max_s = 60

[budget]
max_usd = 0.0                # free tier: refuse anything that would be charged

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-22, before any LLM data on MT-Bench existed (docs/guarantees.md).
# alpha = 0.25 is roughly the human ceiling: a typical human agrees with the other
# voters' majority 74.6% of the time on the calibration half. Do not change after
# seeing results; --alpha-vs-human is reported as a sensitivity analysis only.
alpha = 0.25
delta = 0.1
registered = "2026-11-22"
note = "MT-Bench: risk <= 0.25 vs the per-comparison majority human label"

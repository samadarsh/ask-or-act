# SMOKE TEST: 20 examples on Groq's FREE tier ($0 charged; list price recorded).
# Uses the daily free quota. Always run with --dry-run first.
# Self-consistency here relies on temperature alone (sample_variation = "none"),
# to check that Groq's temperature really produces diverse samples.
name = "smoke-groq-gpt-oss-120b-banking77"

[dataset]
manifest = "data/samples/banking77.json"
split = "test"
limit = 20

[decider]
type = "groq"
model = "openai/gpt-oss-120b"
prompt_version = "v1"

[decider.params]
tier = "free"
confidence_signal = "verbalized"
temperature = 0.0
samples = 5
sample_temperature = 1.0
sample_variation = "none"
reasoning_effort = "low"
max_output_tokens = 1024     # reasoning tokens count here; too low truncates
expected_output_tokens = 250 # estimate incl. hidden reasoning; calibrate after the run

[execution]
max_concurrency = 2
requests_per_minute = 25     # free tier: 30 RPM
tokens_per_minute = 7000     # free tier: 8K TPM
requests_per_day = 1000      # free tier: 1K RPD (plan warning; Groq enforces)
tokens_per_day = 200000      # free tier: 200K TPD
timeout_s = 180
max_retries = 6
backoff_max_s = 60

[budget]
max_usd = 0.0                # free tier: refuse anything that would be charged

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

# The M7 analysis spec: every decider, run config and cascade in docs/analysis-plan.md
# (FROZEN dc2ea31). Read by scripts/analyze_study.py. Nothing in a study run is read
# until every config in the schedule below has a completed run.
label = "study"
schedule = "configs/study/schedule.toml"
seen_ids = "configs/pilot/seen_test_ids.json"
deviations = []

[notes]
banking77 = "the Banking77 target was registered 6 min 49 s after the first Banking77 pilot calls (docs/guarantees.md): not a clean pre-registration"


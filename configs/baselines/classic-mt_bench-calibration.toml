# Free baseline: answer-length features + logistic regression, Platt-calibrated (mt_bench).
# Calibration half: for fitting thresholds (milestone 3b).
name = "classic-mt_bench-calibration"

[dataset]
manifest = "data/samples/mt_bench.json"
split = "calibration"   # thresholds are fitted here, never on test; cross-fitted (5 folds)

[decider]
type = "classic"
model = "length-logreg-v1"
prompt_version = "none"

[decider.params]
C = 4.0
cv = 5
seed = 0

[execution]
max_concurrency = 1
timeout_s = 120
max_retries = 3

[budget]
max_usd = 0.0

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-21 (UTC; commit f73f6e0, 18:53:21 UTC), before any LLM data on
# MT-Bench existed (the first MT-Bench pilot call was at 19:37:24 UTC). alpha = 0.25 is
# roughly the human ceiling: a typical human agrees with the other voters' majority
# 74.6% of the time on the calibration half. Do not change after seeing results;
# --alpha-vs-human is reported as a sensitivity analysis only.
alpha = 0.25
delta = 0.1
registered = "2026-11-21"
note = "MT-Bench: risk <= 0.25 vs the per-comparison majority human label"

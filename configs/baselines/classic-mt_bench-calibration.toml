# Free baseline: answer-length features + logistic regression, Platt-calibrated (mt_bench).
# Calibration half: for fitting thresholds (milestone 3b).
name = "classic-mt_bench-calibration"

[dataset]
manifest = "data/samples/mt_bench.json"
split = "calibration"   # thresholds are fitted here, never on test; cross-fitted (5 folds)

[decider]
type = "classic"
model = "length-logreg-v1"
prompt_version = "none"

[decider.params]
C = 4.0
cv = 5
seed = 0

[execution]
max_concurrency = 1
timeout_s = 120
max_retries = 3

[budget]
max_usd = 0.0

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

# Free baseline: TF-IDF + logistic regression, Platt-calibrated (banking77).
name = "classic-banking77"

[dataset]
manifest = "data/samples/banking77.json"
split = "test"

[decider]
type = "classic"
model = "tfidf-logreg-v1"
prompt_version = "none"

[decider.params]
C = 4.0
cv = 5
seed = 0

[execution]
max_concurrency = 1
timeout_s = 120
max_retries = 3

[budget]
max_usd = 0.0

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-22, before the pilot or any study data (docs/guarantees.md).
# Only the 2026-11-20 smoke runs (20 test examples) existed; alpha = 0.10 was the
# default before them. Do not change after seeing results.
alpha = 0.10
delta = 0.10
registered = "2026-11-22"
note = "Banking77: risk <= 0.10 (wrong intent) on routed queries"

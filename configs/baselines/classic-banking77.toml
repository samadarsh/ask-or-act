# Free baseline: TF-IDF + logistic regression, Platt-calibrated (banking77).
name = "classic-banking77"

[dataset]
manifest = "data/samples/banking77.json"
split = "test"

[decider]
type = "classic"
model = "tfidf-logreg-v1"
prompt_version = "none"

[decider.params]
C = 4.0
cv = 5
seed = 0

[execution]
max_concurrency = 1
timeout_s = 120
max_retries = 3

[budget]
max_usd = 0.0

[cache]
path = ".cache/decisions.sqlite"

[output]
runs_dir = "runs"

[guarantee]
# PRE-REGISTERED 2026-11-21 (UTC; commit 4ce46c1, 19:27:51 UTC). alpha = 0.10 was the
# CLI default before any LLM data. Do not change after seeing results.
# Caveat: the first Banking77 pilot calls began at 19:21:02 UTC, before this
# commit, and p1's result (20 test examples, accuracy 0.80) was printed at
# 19:22:54 UTC. The 2026-11-20 smoke runs (20 test examples) also existed.
alpha = 0.10
delta = 0.10
registered = "2026-11-21"
note = "Banking77: risk <= 0.10 (wrong intent) on routed queries"
